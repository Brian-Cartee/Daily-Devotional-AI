# Force Dockerfile builds (avoids Nixpacks frozen-lockfile loop).
# Production is AWS Lightsail — see docs/RAILWAY.md to pause or remove this project.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
