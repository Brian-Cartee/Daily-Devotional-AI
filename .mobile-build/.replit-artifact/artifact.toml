kind = "mobile"
previewPath = "/shepherds-path-mobile/"
title = "Shepherd's Path"
version = "1.0.0"
id = "artifacts/shepherds-path-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/shepherds-path-mobile/" ]
localPort = 24628

[services.development]
run = "pnpm --filter @workspace/shepherds-path-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shepherds-path-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/shepherds-path-mobile", "run", "serve" ]

[services.env]
PORT = "24628"
BASE_PATH = "/shepherds-path-mobile/"
