    <script>
    (function () {
      function readCookie(name) {
        try {
          var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
          return m ? decodeURIComponent(m[1]) : null;
        } catch (e) {
          return null;
        }
      }
      function writeCookie(name, value) {
        try {
          var secure = location.protocol === "https:" ? "; Secure" : "";
          var domain =
            location.hostname.indexOf("shepherdspathai.com") >= 0
              ? "; domain=.shepherdspathai.com"
              : "";
          document.cookie =
            name +
            "=" +
            encodeURIComponent(value) +
            "; path=/; max-age=63072000; SameSite=Lax" +
            secure +
            domain;
        } catch (e) {}
      }
      function persistLocalSubscriber(email, sessionId) {
        if (!email || email.indexOf("@") < 1) return;
        localStorage.setItem("sp-subscribed-email", email);
        localStorage.setItem("sp-email-subscribed", "true");
        writeCookie("sp_subscriber_email", email);
        writeCookie("sp_email_subscribed", "true");
        try {
          sessionStorage.setItem("sp-subscribed-email", email);
          sessionStorage.setItem("sp-email-subscribed", "true");
        } catch (e) {}
        window.__SP_SUBSCRIBER_BOOT__ = { subscribed: true, email: email, sessionId: sessionId || "" };
        notifyNativeEmail(email);
      }
      function isNativeAppShell() {
        try {
          return (!!window.ReactNativeWebView || location.search.indexOf("native=1") >= 0);
        } catch (e) { return false; }
      }
      function syncStatusFromServer(sessionId, emailHint) {
        if (isNativeAppShell()) return null; // Skip blocking sync XHR — WebView hangs on main-thread network calls
        try {
          var parts = [];
          if (sessionId) parts.push("sessionId=" + encodeURIComponent(sessionId));
          if (emailHint && emailHint.indexOf("@") > 0) {
            parts.push("email=" + encodeURIComponent(emailHint));
          }
          var url = "/api/subscribe/status" + (parts.length ? "?" + parts.join("&") : "");
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, false);
          xhr.withCredentials = true;
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
            return JSON.parse(xhr.responseText);
          }
        } catch (e) {}
        return null;
      }
      function notifyNativeEmail(email) {
        try {
          if (!window.ReactNativeWebView || !email || email.indexOf("@") < 1) return;
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: "sp_subscriber_profile", email: email }),
          );
          window.ReactNativeWebView.postMessage(
            JSON.stringify({
              type: "sp_user_profile",
              subscriberEmail: email,
              sessionId: localStorage.getItem("sp_session_id") || readCookie("sp_session_id") || "",
            }),
          );
        } catch (e) {}
      }
      try {
        var params = new URLSearchParams(location.search);
        var sid =
          (window.__SP_SESSION_BOOT__ || "") ||
          params.get("ssid") ||
          localStorage.getItem("sp_session_id") ||
          readCookie("sp_session_id") ||
          "";
        sid = String(sid || "").trim();
        if (sid) {
          localStorage.setItem("sp_session_id", sid);
          writeCookie("sp_session_id", sid);
          window.__SP_SESSION_BOOT__ = sid;
          try {
            sessionStorage.setItem("sp_session_id", sid);
          } catch (e) {}
        }
        var bootSub = window.__SP_SUBSCRIBER_BOOT__;
        var em = (
          (bootSub && bootSub.email) ||
          localStorage.getItem("sp-subscribed-email") ||
          readCookie("sp_subscriber_email") ||
          ""
        )
          .trim()
          .toLowerCase();
        var sub =
          (bootSub && bootSub.subscribed) ||
          localStorage.getItem("sp-email-subscribed") === "true" ||
          readCookie("sp_email_subscribed") === "true";
        if (!em || em.indexOf("@") < 1) {
          var pro = (
            localStorage.getItem("sp_pro_email") ||
            readCookie("sp_pro_email") ||
            ""
          )
            .trim()
            .toLowerCase();
          if (pro.indexOf("@") > 0) em = pro;
        }
        var se = params.get("se");
        if (se && se.indexOf("@") > 0) {
          em = se.trim().toLowerCase();
        }
        if (em && em.indexOf("@") > 0) {
          persistLocalSubscriber(em, sid);
          if (sid) syncStatusFromServer(sid, em);
        } else if (sub) {
          localStorage.setItem("sp-email-subscribed", "true");
          if (sid && (!em || em.indexOf("@") < 1)) {
            var subStatus = syncStatusFromServer(sid, null);
            if (subStatus && subStatus.subscribed && subStatus.email) {
              em = String(subStatus.email).trim().toLowerCase();
              persistLocalSubscriber(em, sid);
            }
          }
        } else if (sid) {
          var serverStatus = syncStatusFromServer(sid, em || null);
          if (serverStatus && serverStatus.subscribed && serverStatus.email) {
            em = String(serverStatus.email).trim().toLowerCase();
            persistLocalSubscriber(em, sid);
          }
        }
        if (!em || em.indexOf("@") < 1) {
          var cookieStatus = syncStatusFromServer("", null);
          if (cookieStatus && cookieStatus.subscribed && cookieStatus.email) {
            em = String(cookieStatus.email).trim().toLowerCase();
            persistLocalSubscriber(em, sid || "");
          }
        }
        if (sid) {
          window.__SP_SESSION_BOOT__ = sid;
          try {
            window.ReactNativeWebView &&
              window.ReactNativeWebView.postMessage(
                JSON.stringify({
                  type: "sp_user_profile",
                  sessionId: sid,
                  subscriberEmail: em || "",
                }),
              );
          } catch (e) {}
        }
      } catch (e) {}
    })();
    </script>

    <!-- App Store WebView bridge (module script is inserted after this block in production builds) -->
    <!-- SP_NATIVE_BRIDGE_START -->
    <script>
    (function () {
      function diagViaScheme(event, detail) {
        try {
          var iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src =
            "shepherdspath://diag?event=" +
            encodeURIComponent(String(event || "")) +
            "&detail=" +
            encodeURIComponent(String(detail || "").slice(0, 200));
          document.documentElement.appendChild(iframe);
          setTimeout(function () {
            iframe.remove();
          }, 120);
        } catch (e) {}
      }

      function startNativeBridge(bridge) {
      if (window.__spNativeBridgeStarted) return;
      window.__spNativeBridgeStarted = true;

      document.documentElement.setAttribute("data-sp-shell", "native");
      document.documentElement.classList.add("sp-native-shell");

      var debugPanel = /(?:\?|&)debugNative=1(?:&|$)/.test(location.search);

      function diag(event, detail) {
        var entry = {
          type: "sp_diag",
          event: String(event || ""),
          detail: String(detail || "").slice(0, 500),
          ts: Date.now(),
        };
        window.__spDiagLogs = window.__spDiagLogs || [];
        window.__spDiagLogs.push(entry);
        if (window.__spDiagLogs.length > 48) window.__spDiagLogs.shift();
        var posted = false;
        try {
          bridge.postMessage(JSON.stringify(entry));
          posted = true;
        } catch (e) {}
        if (!posted) diagViaScheme(entry.event, entry.detail);
        if (debugPanel) updateDebugPanel();
        var ev = String(event || "");
        var det = String(detail || "");
        if (ev === "resource_error" && /fonts\.googleapis|fonts\.gstatic/i.test(det)) return;
        if (ev === "resource_error") return;
        if (ev === "module_script_loaded") setBootStatus("Loading app\u2026");
        else if (ev === "html_loaded") setBootStatus("Loading\u2026");
      }
      window.__spDiag = diag;

      function updateDebugPanel() {
        var panel = document.getElementById("sp-native-debug-panel");
        if (!panel) return;
        var logs = window.__spDiagLogs || [];
        panel.textContent = logs
          .slice(-14)
          .map(function (x) {
            return new Date(x.ts).toISOString().slice(11, 19) + " " + x.event + (x.detail ? ": " + x.detail : "");
          })
          .join("\n");
      }

      function initDebugPanel() {
        if (!debugPanel || document.getElementById("sp-native-debug-panel")) return;
        var panel = document.createElement("pre");
        panel.id = "sp-native-debug-panel";
        panel.style.cssText =
          "position:fixed;left:0;right:0;bottom:0;z-index:100001;max-height:38vh;margin:0;padding:8px 10px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#f4efe6;background:rgba(0,0,0,0.88);overflow:auto;white-space:pre-wrap;border-top:1px solid rgba(212,165,116,0.35);";
        document.body.appendChild(panel);
        updateDebugPanel();
      }

      diag("html_loaded", location.pathname + location.search);

      function isBenignShellError(msg) {
        var s = String(msg || "");
        return /ResizeObserver|AbortError|NotAllowedError|play\(\) request was interrupted|The operation was aborted|Non-Error promise rejection|cancelled|Script error\.|MetaMask|postMessage|SecurityError|blocked a frame|cancelled/i.test(s);
      }

      function reportShellError(msg, detail, eventName) {
        var text = String(msg || "");
        var extra = String(detail || "");
        diag(eventName || "js_error", text + (extra ? " | " + extra : ""));
        if (isBenignShellError(text) || isBenignShellError(extra)) return;
        try {
          bridge.postMessage(JSON.stringify({ type: "js_error", msg: text, detail: extra }));
        } catch (e) {}
      }

      window.onerror = function (msg, url, line, col, err) {
        reportShellError(msg, (url || "") + ":" + line + ":" + col + " " + (err && err.message), "window_onerror");
      };
      window.onunhandledrejection = function (ev) {
        var reason = ev && ev.reason;
        reportShellError(reason, reason && (reason.stack || reason.message), "unhandledrejection");
      };

      window.addEventListener(
        "error",
        function (ev) {
          var t = ev && ev.target;
          if (!t || t === window) return;
          var tag = t.tagName || "unknown";
          if (tag === "SCRIPT" || tag === "LINK" || tag === "IMG") {
            var src = t.src || t.href || "";
            if (/fonts\.googleapis|fonts\.gstatic/i.test(src)) return;
            diag("resource_error", tag + " " + src);
          }
        },
        true,
      );

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initDebugPanel);
      } else {
        initDebugPanel();
      }

      var visibleSelectors =
        '[data-testid="card-devotional"],[data-testid="bottom-nav-for-you"],[data-testid="home-threshold-hero"],#sp-home-top,[data-testid="text-threshold-welcome"],[data-testid="threshold-arrival"],[data-testid="btn-threshold-enter"]';

      function hasVisibleAppUi() {
        return !!document.querySelector(visibleSelectors);
      }

      var sent = false;
      function notify() {
        if (sent) return;
        if (!hasVisibleAppUi()) return;
        document.documentElement.setAttribute("data-native-ui-ready", "1");
        document.getElementById("sp-boot-splash")?.remove();
        document.getElementById("sp-native-recovery")?.remove();
        sent = true;
        try {
          bridge.postMessage(JSON.stringify({ type: "web_ui_visible" }));
          bridge.postMessage(JSON.stringify({ type: "app_ready" }));
        } catch (e) {}
      }

      function setBootStatus(text) {
        var el = document.getElementById("sp-boot-splash-status");
        if (!el) return;
        el.textContent = text;
        el.style.fontSize = "13px";
        el.style.maxWidth = "320px";
        el.style.wordBreak = "break-word";
      }

      function latestDiagSummary(max) {
        var logs = window.__spDiagLogs || [];
        if (!logs.length) return "No events yet";
        return logs
          .slice(-(max || 10))
          .map(function (x) {
            return x.event + (x.detail ? ": " + x.detail : "");
          })
          .join("\n");
      }

      /** Overlay only — never replace #root (that kills React mid-bundle on slow WebViews). */
      function showWebReloadScreen() {
        if (document.getElementById("sp-native-recovery")) return;
        setBootStatus("Still loading\u2026");
        var layer = document.createElement("div");
        layer.id = "sp-native-recovery";
        layer.style.cssText =
          "position:fixed;inset:0;z-index:100000;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:rgba(13,6,18,0.97);color:#f4efe6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;";
        var logs = window.__spDiagLogs || [];
        var diagText = logs.length
          ? logs
              .slice(-8)
              .map(function (x) {
                return x.event + (x.detail ? ": " + x.detail : "");
              })
              .join("\n")
          : "No diagnostic events captured.";
        layer.innerHTML =
          '<p style="font-size:20px;font-weight:700;margin:0 0 10px;">Having trouble loading</p>' +
          '<p style="font-size:14px;line-height:1.45;opacity:0.9;margin:0 0 12px;max-width:320px;">The app may still be loading. Tap Reload to try again.</p>' +
          '<pre style="font:11px/1.35 ui-monospace,Menlo,monospace;text-align:left;max-width:320px;max-height:28vh;overflow:auto;padding:10px;margin:0 0 16px;background:rgba(0,0,0,0.35);border-radius:8px;white-space:pre-wrap;">' +
          diagText.replace(/</g, "&lt;") +
          "</pre>" +
          '<button type="button" id="sp-native-reload-btn" style="background:#d4a574;color:#1a1208;border:none;border-radius:12px;padding:16px 28px;font-size:16px;font-weight:700;">Reload</button>';
        document.body.appendChild(layer);
        diag("recovery_screen_shown", diagText.slice(0, 200));
        if (debugPanel) {
          try {
            alert("Shepherd's Path load status:\n\n" + diagText);
          } catch (e2) {}
        }
        document.getElementById("sp-native-reload-btn")?.addEventListener("click", function () {
          hardReloadApp();
        });
      }

      function hardReloadApp() {
        var u = "/?native=1&enter=1&_=" + Date.now();
        location.replace(u);
      }

      var enterBtn = document.getElementById("sp-enter-btn");
      if (enterBtn) {
        enterBtn.style.display = "none";
      }
      if (enterBtn) {
        enterBtn.addEventListener("click", function () {
          if (!hasVisibleAppUi()) hardReloadApp();
          else notify();
        });
      }

      function poll() {
        notify();
        if (!sent) setTimeout(poll, 200);
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", poll);
      } else {
        poll();
      }

      window.addEventListener("sp-app-ready", function () {
        notify();
      });

      setTimeout(function () {
        if (hasVisibleAppUi()) return;
        setBootStatus("Still loading\u2026");
      }, 8000);

      setTimeout(function () {
        if (!debugPanel || hasVisibleAppUi()) return;
        try {
          alert("Still loading (6s):\n\n" + latestDiagSummary(10));
        } catch (e) {}
      }, 6000);

      setTimeout(function () {
        if (!debugPanel || hasVisibleAppUi()) return;
        try {
          alert("Still loading (12s):\n\n" + latestDiagSummary(12));
        } catch (e) {}
      }, 12000);

      setTimeout(function () {
        if (hasVisibleAppUi()) return;
        showWebReloadScreen();
      }, 30000);

      function hookModuleScript() {
        function attach(attempts) {
          var mod = document.querySelector('script[type="module"]');
          if (!mod) {
            if (attempts < 80) setTimeout(function () { attach(attempts + 1); }, 50);
            return;
          }
          diag("module_script_seen", mod.getAttribute("src") || "");
          function onModuleReady() {
            diag("module_script_loaded", mod.getAttribute("src") || "");
            setBootStatus("Loading app\u2026");
            setTimeout(function () { poll(); }, 0);
            setTimeout(function () { poll(); }, 120);
            setTimeout(function () { poll(); }, 600);
            setTimeout(function () { poll(); }, 1800);
            setTimeout(function () { poll(); }, 4000);
            setTimeout(function () { poll(); }, 8000);
          }
          mod.addEventListener("load", onModuleReady);
          mod.addEventListener("error", function () {
            diag("module_script_error", mod.getAttribute("src") || "");
            if (window.__spModuleSrc || hasVisibleAppUi()) return;
            showWebReloadScreen();
          });
          if (document.readyState === "complete") {
            onModuleReady();
          }
