  <script>

            regs.forEach(function(r) { r.unregister(); });
          });
        }
      } catch (e) {}
    })();

    <script type="module" src="/src/main.tsx"></script>
    <!-- App Store WebView: runs before React — tells native shell when UI is ready (no new iOS build needed) -->
    <script>
    (function () {
      var bridge = window.ReactNativeWebView;
      if (!bridge) return;

      document.documentElement.setAttribute("data-sp-shell", "native");
      document.documentElement.classList.add("sp-native-shell");

      function isBenignShellError(msg) {
        var s = String(msg || "");
        return /ResizeObserver|AbortError|NotAllowedError|play\(\) request was interrupted|The operation was aborted|Non-Error promise rejection|Load failed|cancelled/i.test(s);
      }

      function reportShellError(msg, detail) {
        if (isBenignShellError(msg) || isBenignShellError(detail)) return;
        try {
          bridge.postMessage(JSON.stringify({ type: "js_error", msg: String(msg), detail: detail || "" }));
        } catch (e) {}
      }

      window.onerror = function (msg, _url, _line, _col, err) {
        reportShellError(msg, err && err.message);
      };
      window.onunhandledrejection = function (ev) {
        var reason = ev && ev.reason;
        reportShellError(reason, reason && reason.message);
      };

      function hasMountedApp() {
        var root = document.getElementById("root");
        if (!root || root.children.length === 0) return false;
        return !document.getElementById("sp-boot");
      }

      var sent = false;
      function notify() {
        if (sent || !hasMountedApp()) return;
        sent = true;
        try {
          bridge.postMessage(JSON.stringify({ type: "app_ready" }));
        } catch (e) {}
      }

      function hardReloadApp() {
        var u = "/?native=1&enter=1&_=" + Date.now();
        location.replace(u);
      }

      var enterBtn = document.getElementById("sp-enter-btn");
      if (enterBtn) {
        enterBtn.addEventListener("click", function () {
          if (!hasMountedApp()) hardReloadApp();
          else notify();
        });
      }

      function poll() {
        notify();
        if (!sent) setTimeout(poll, 150);
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", poll);
      } else {
        poll();
      }

      window.addEventListener("sp-app-ready", notify);

      setTimeout(function () {
        if (sent || hasMountedApp()) return;
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:#0d0612;color:#f4efe6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">' +
          '<p style="font-size:20px;font-weight:700;margin:0 0 10px;">Having trouble loading</p>' +
          '<p style="font-size:15px;line-height:1.5;opacity:0.9;margin:0 0 22px;max-width:300px;">Tap Reload, or open shepherdspathai.com in Safari.</p>' +
          '<button type="button" onclick="location.reload()" style="background:#d4a574;color:#1a1208;border:none;border-radius:12px;padding:16px 28px;font-size:16px;font-weight:700;">Reload</button></div>';
      }, 14000);

      var mod = document.querySelector('script[type="module"]');
      if (mod) {
        mod.addEventListener("load", function () { setTimeout(poll, 50); });
        mod.addEventListener("error", function () {
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:#0d0612;color:#f4efe6;font-family:system-ui,sans-serif;">' +
            '<p style="font-size:18px;font-weight:600;margin:0 0 12px;">Could not load the app</p>' +
            '<button type="button" onclick="location.reload()" style="background:#d4a574;color:#1a1208;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:700;">Try again</button></div>';
        });
      }
    })();
    </script>
