    <script>
    (function () {
      // ── MINIMUM NATIVE VERSION GATE ──────────────────────────────────────
      // Native binary sends ?nv=X.X.X in the URL (added in v2.1.6+).
      // If the version is below MIN_NATIVE_VERSION, replace the page with a
      // friendly "Please update" screen instead of silently breaking.
      //
      // To block an old broken version:
      //   1. Bump MIN_NATIVE_VERSION below to the first GOOD version
      //   2. Deploy — old binary users immediately see the update prompt
      //
      // Leave MIN_NATIVE_VERSION as "" to allow all versions (safe default).
      var MIN_NATIVE_VERSION = "";

      function parseVer(v) {
        return (v || "0.0.0").split(".").map(function(n) { return parseInt(n, 10) || 0; });
      }
      function versionLessThan(a, b) {
        var av = parseVer(a), bv = parseVer(b);
        for (var i = 0; i < 3; i++) {
          if (av[i] < bv[i]) return true;
          if (av[i] > bv[i]) return false;
        }
        return false;
      }

      try {
        if (MIN_NATIVE_VERSION && window.ReactNativeWebView) {
          var params = new URLSearchParams(location.search);
          var nv = params.get("nv") || "";
          if (nv && versionLessThan(nv, MIN_NATIVE_VERSION)) {
            document.documentElement.innerHTML = [
              '<html><head><meta name="viewport" content="width=device-width,initial-scale=1">',
              '<style>',
              'body{margin:0;background:#0d0612;color:#e8d9f0;font-family:-apple-system,sans-serif;',
              'display:flex;flex-direction:column;align-items:center;justify-content:center;',
              'min-height:100vh;text-align:center;padding:32px;box-sizing:border-box;}',
              'img{width:72px;height:72px;border-radius:16px;margin-bottom:24px;}',
              'h1{font-size:22px;font-weight:700;margin:0 0 12px;}',
              'p{font-size:16px;color:#c0a8cc;margin:0 0 32px;line-height:1.5;}',
              'a{display:block;background:#7A018D;color:#fff;text-decoration:none;',
              'padding:16px 32px;border-radius:14px;font-size:17px;font-weight:600;}',
              '</style></' + 'head><body>',
              '<img src="/app-icon.png" alt="Shepherd\'s Path">',
              '<h1>Update Required</h1>',
              '<p>A new version of Shepherd\'s Path is available.<br>Please update to continue.</p>',
              '<a href="https://apps.apple.com/app/id6760953522">Update in App Store</a>',
              '</body></html>'
            ].join("");
            return;
          }
        }
      } catch (_e) {}

      // Fire react_booted at the absolute earliest moment — first script tag.
      // Hides the Expo native splash (pure black) before any other JS runs.
      try {
        var _b = window.ReactNativeWebView;
        if (_b) _b.postMessage(JSON.stringify({ type: "react_booted", ts: Date.now() }));
      } catch (_e) {}

      if (!window.ReactNativeWebView) return;
      if (location.pathname.indexOf("native-shell") >= 0) return;
      if (location.search.indexOf("enter=1") >= 0) return;
      location.replace("/native-shell.html");
    })();
    </script>

    <script>
    (function () {
      function readCookie(name) {
        try {
          var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
          return m ? decodeURIComponent(m[1]) : null;
        } catch (e) {
          return null;
        }
      }
      function writeCookie(name, value) {
        try {
          var secure = location.protocol === "https:" ? "; Secure" : "";
          var domain =
            location.hostname.indexOf("shepherdspathai.com") >= 0
              ? "; domain=.shepherdspathai.com"
              : "";
          document.cookie =
            name +
            "=" +
            encodeURIComponent(value) +
            "; path=/; max-age=63072000; SameSite=Lax" +
            secure +
            domain;
        } catch (e) {}
      }
      function persistLocalSubscriber(email, sessionId) {
        if (!email || email.indexOf("@") < 1) return;
        localStorage.setItem("sp-subscribed-email", email);
        localStorage.setItem("sp-email-subscribed", "true");
        writeCookie("sp_subscriber_email", email);
        writeCookie("sp_email_subscribed", "true");
        try {
          sessionStorage.setItem("sp-subscribed-email", email);
          sessionStorage.setItem("sp-email-subscribed", "true");
        } catch (e) {}
        window.__SP_SUBSCRIBER_BOOT__ = { subscribed: true, email: email, sessionId: sessionId || "" };
        notifyNativeEmail(email);
      }
      function isNativeAppShell() {
        try {
          return (!!window.ReactNativeWebView || location.search.indexOf("native=1") >= 0);
        } catch (e) { return false; }
      }
      function syncStatusFromServer(sessionId, emailHint) {
        if (isNativeAppShell()) return null; // Skip blocking sync XHR — WebView hangs on main-thread network calls
        try {
          var parts = [];
          if (sessionId) parts.push("sessionId=" + encodeURIComponent(sessionId));
          if (emailHint && emailHint.indexOf("@") > 0) {
            parts.push("email=" + encodeURIComponent(emailHint));
          }
          var url = "/api/subscribe/status" + (parts.length ? "?" + parts.join("&") : "");
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, false);
          xhr.withCredentials = true;
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
            return JSON.parse(xhr.responseText);
          }
        } catch (e) {}
        return null;
      }
      function notifyNativeEmail(email) {
        try {
          if (!window.ReactNativeWebView || !email || email.indexOf("@") < 1) return;
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: "sp_subscriber_profile", email: email }),
          );
          window.ReactNativeWebView.postMessage(
            JSON.stringify({
              type: "sp_user_profile",
              subscriberEmail: email,
              sessionId: localStorage.getItem("sp_session_id") || readCookie("sp_session_id") || "",
            }),
          );
        } catch (e) {}
      }
      try {
        var params = new URLSearchParams(location.search);
        var sid =
          (window.__SP_SESSION_BOOT__ || "") ||
          params.get("ssid") ||
          localStorage.getItem("sp_session_id") ||
          readCookie("sp_session_id") ||
          "";
        sid = String(sid || "").trim();
        if (sid) {
          localStorage.setItem("sp_session_id", sid);
          writeCookie("sp_session_id", sid);
          window.__SP_SESSION_BOOT__ = sid;
          try {
            sessionStorage.setItem("sp_session_id", sid);
          } catch (e) {}
        }
        var bootSub = window.__SP_SUBSCRIBER_BOOT__;
        var em = (
          (bootSub && bootSub.email) ||
          localStorage.getItem("sp-subscribed-email") ||
          readCookie("sp_subscriber_email") ||
          ""
        )
          .trim()
          .toLowerCase();
        var sub =
          (bootSub && bootSub.subscribed) ||
          localStorage.getItem("sp-email-subscribed") === "true" ||
          readCookie("sp_email_subscribed") === "true";
        if (!em || em.indexOf("@") < 1) {
          var pro = (
            localStorage.getItem("sp_pro_email") ||
            readCookie("sp_pro_email") ||
            ""
          )
            .trim()
            .toLowerCase();
          if (pro.indexOf("@") > 0) em = pro;
        }
        var se = params.get("se");
        if (se && se.indexOf("@") > 0) {
          em = se.trim().toLowerCase();
        }
        if (em && em.indexOf("@") > 0) {
          persistLocalSubscriber(em, sid);
          if (sid) syncStatusFromServer(sid, em);
        } else if (sub) {
          localStorage.setItem("sp-email-subscribed", "true");
          if (sid && (!em || em.indexOf("@") < 1)) {
            var subStatus = syncStatusFromServer(sid, null);
            if (subStatus && subStatus.subscribed && subStatus.email) {
              em = String(subStatus.email).trim().toLowerCase();
              persistLocalSubscriber(em, sid);
            }
          }
        } else if (sid) {
          var serverStatus = syncStatusFromServer(sid, em || null);
          if (serverStatus && serverStatus.subscribed && serverStatus.email) {
            em = String(serverStatus.email).trim().toLowerCase();
            persistLocalSubscriber(em, sid);
          }
        }
        if (!em || em.indexOf("@") < 1) {
          var cookieStatus = syncStatusFromServer("", null);
          if (cookieStatus && cookieStatus.subscribed && cookieStatus.email) {
            em = String(cookieStatus.email).trim().toLowerCase();
            persistLocalSubscriber(em, sid || "");
          }
        }
        if (sid) {
          window.__SP_SESSION_BOOT__ = sid;
          try {
            window.ReactNativeWebView &&
              window.ReactNativeWebView.postMessage(
                JSON.stringify({
                  type: "sp_user_profile",
                  sessionId: sid,
                  subscriberEmail: em || "",
                }),
              );
          } catch (e) {}
        }
      } catch (e) {}
    })();
    </script>

    <script>

    <script>
    (function () {
      if (!window.ReactNativeWebView) return;
      var mount = document.getElementById("sp-app-mount");
      if (!mount) return;
      var layer = document.createElement("div");
      layer.id = "sp-native-boot-placeholder";

      layer.style.cssText =
        "min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0612;color:#ede8e0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:28px;text-align:center;";

    <!-- App Store WebView bridge (module script is inserted after this block in production builds) -->
    <!-- SP_NATIVE_BRIDGE_START -->
    <script>
    (function () {
      function diagViaScheme(event, detail) {
        try {
          var iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src =
            "shepherdspath://diag?event=" +
            encodeURIComponent(String(event || "")) +
            "&detail=" +
            encodeURIComponent(String(detail || "").slice(0, 200));
          document.documentElement.appendChild(iframe);
          setTimeout(function () {
            iframe.remove();
          }, 120);
        } catch (e) {}
      }

      function startNativeBridge(bridge) {
      if (window.__spNativeBridgeStarted) return;
      window.__spNativeBridgeStarted = true;

      document.documentElement.setAttribute("data-sp-shell", "native");
      document.documentElement.classList.add("sp-native-shell");

      function spRemoveId(id) {
        var el = document.getElementById(id);
        if (el && el.remove) el.remove();
      }

      var debugPanel = /(?:\?|&)debugNative=1(?:&|$)/.test(location.search);

      function diag(event, detail) {
        var entry = {
          type: "sp_diag",
          event: String(event || ""),
          detail: String(detail || "").slice(0, 500),
          ts: Date.now(),
        };
        window.__spDiagLogs = window.__spDiagLogs || [];
        window.__spDiagLogs.push(entry);
        if (window.__spDiagLogs.length > 48) window.__spDiagLogs.shift();
        var posted = false;
        try {
          bridge.postMessage(JSON.stringify(entry));
          posted = true;
        } catch (e) {}
        if (!posted) diagViaScheme(entry.event, entry.detail);
        if (debugPanel) updateDebugPanel();
        var ev = String(event || "");
        var det = String(detail || "");
        if (ev === "resource_error" && /fonts\.googleapis|fonts\.gstatic/i.test(det)) return;
        if (ev === "resource_error") return;
        if (ev === "module_script_loaded") setBootStatus("Loading app\u2026");
        else if (ev === "html_loaded") setBootStatus("Loading\u2026");
      }
      window.__spDiag = diag;

      function updateDebugPanel() {
        var panel = document.getElementById("sp-native-debug-panel");
        if (!panel) return;
        var logs = window.__spDiagLogs || [];
        panel.textContent = logs
          .slice(-14)
          .map(function (x) {
            return new Date(x.ts).toISOString().slice(11, 19) + " " + x.event + (x.detail ? ": " + x.detail : "");
          })
          .join("\n");
      }

      function initDebugPanel() {
        if (!debugPanel || document.getElementById("sp-native-debug-panel")) return;
        var panel = document.createElement("pre");
        panel.id = "sp-native-debug-panel";
        panel.style.cssText =
          "position:fixed;left:0;right:0;bottom:0;z-index:100001;max-height:38vh;margin:0;padding:8px 10px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#f4efe6;background:rgba(0,0,0,0.88);overflow:auto;white-space:pre-wrap;border-top:1px solid rgba(212,165,116,0.35);";
        document.body.appendChild(panel);
        updateDebugPanel();
      }

      diag("html_loaded", location.pathname + location.search);

      function isBenignShellError(msg) {
        var s = String(msg || "");
        return /ResizeObserver|AbortError|NotAllowedError|play\(\) request was interrupted|The operation was aborted|Non-Error promise rejection|cancelled|Script error\.|MetaMask|postMessage|SecurityError|blocked a frame|cancelled|Unexpected keyword ['']true|SyntaxError.*\btrue\b/i.test(s);
      }

      function reportShellError(msg, detail, eventName) {
        var text = String(msg || "");
        var extra = String(detail || "");
        diag(eventName || "js_error", text + (extra ? " | " + extra : ""));
        if (isBenignShellError(text) || isBenignShellError(extra)) return;
        try {
          bridge.postMessage(JSON.stringify({ type: "js_error", msg: text, detail: extra }));
        } catch (e) {}
      }

      window.onerror = function (msg, url, line, col, err) {
        reportShellError(msg, (url || "") + ":" + line + ":" + col + " " + (err && err.message), "window_onerror");
      };
      window.onunhandledrejection = function (ev) {
        var reason = ev && ev.reason;
        reportShellError(reason, reason && (reason.stack || reason.message), "unhandledrejection");
      };

      window.addEventListener(
        "error",
        function (ev) {
          var t = ev && ev.target;
          if (!t || t === window) return;
          var tag = t.tagName || "unknown";
          if (tag === "SCRIPT" || tag === "LINK" || tag === "IMG") {
            var src = t.src || t.href || "";
            if (/fonts\.googleapis|fonts\.gstatic/i.test(src)) return;
            diag("resource_error", tag + " " + src);
          }
        },
        true,
      );

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initDebugPanel);
      } else {
        initDebugPanel();
      }

      var visibleSelectors =
        '[data-testid="landing-home"],[data-testid="sp-splash-active"],[data-testid="splash-icebreaker"],[data-testid="splash-icebreaker-callback"],[data-testid="card-devotional"],[data-testid="bottom-nav-for-you"],[data-testid="home-threshold-hero"],#sp-home-top,[data-testid="text-threshold-welcome"],[data-testid="threshold-arrival"],[data-testid="btn-threshold-enter"],[data-testid="night-shepherd"],[data-testid="btn-night-continue-greet"],[data-testid="guidance-page"],[data-testid="salvation-page"],[data-testid="journey-page"]';

      function isBootPlaceholder(node) {
        return !!(node && node.id === "sp-native-boot-placeholder");
      }

      function hasVisibleAppUi() {
        var el = document.querySelector(visibleSelectors);
        if (!el || isBootPlaceholder(el)) return false;
        return true;
      }

      function hasReactMounted() {
        var mount = document.getElementById("sp-app-mount");
        if (!mount || !mount.firstElementChild) return false;
        return !isBootPlaceholder(mount.firstElementChild);
      }

      function hasBootPlaceholder() {
        return !!document.getElementById("sp-native-boot-placeholder");
      }

      var sent = false;
      function notifyAppReadyViaScheme() {
        try {
          var iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src = "shepherdspath://app-ready";
          document.documentElement.appendChild(iframe);
          setTimeout(function () {
            iframe.remove();
          }, 120);
        } catch (e) {}
      }

      function notify(force) {
        if (sent && !force) return;
        if (!force && !hasVisibleAppUi()) return;
        document.documentElement.setAttribute("data-native-ui-ready", "1");
        spRemoveId("sp-native-recovery");
        spRemoveId("sp-boot-splash");
        spRemoveId("sp-fg-cover");
        sent = true;
        // NOTE: sp-boot-splash is removed by __spSignalReady (called by React after paint).
        // Only remove covers here as a last-resort fallback (force=true from timeouts).
        if (force) {
          spRemoveId("sp-boot-splash");
          spRemoveId("sp-fg-cover");
        }
        try {
          bridge.postMessage(JSON.stringify({ type: "web_ui_visible" }));
          bridge.postMessage(JSON.stringify({ type: "app_ready" }));
        } catch (e) {}
        notifyAppReadyViaScheme();
      }

      // Called by React components after double-RAF (guaranteed post-paint).
      // Removes the web boot cover and signals the native overlay to drop.
      window.__spSignalReady = function() {
        spRemoveId("sp-boot-splash");
        spRemoveId("sp-fg-cover");
        notify(true);
      };

      // Hard fallback: if React has mounted but we still haven't signalled ready
      // (e.g. app landed on a page whose testid isn't in visibleSelectors),
      // force-dismiss the splash after 7 s so the user always sees something.
      setTimeout(function () {
        if (sent) return;
        if (hasReactMounted()) {
          diag("force_ui_visible", "react_mounted_no_selector_match");
          notify(true);
        }
      }, 7000);

      // After 12 s on placeholder-only boot, show recovery UI.
      setTimeout(function () {
        if (sent || hasVisibleAppUi()) return;
        if (!hasBootPlaceholder() && !hasReactMounted()) return;
        diag("boot_stuck_12s", "placeholder_or_no_react");
        spRemoveId("sp-boot-splash");
        spRemoveId("sp-fg-cover");
        showWebReloadScreen();
      }, 12000);

      function setBootStatus(text) {
        var targets = [
          document.getElementById("sp-boot-splash-status"),
          document.getElementById("sp-native-boot-status"),
        ];
        var i;
        for (i = 0; i < targets.length; i++) {
          var el = targets[i];
          if (!el) continue;
          el.textContent = text;
          el.style.fontSize = "13px";
          el.style.maxWidth = "320px";
          el.style.wordBreak = "break-word";
        }
      }

      function latestDiagSummary(max) {
        var logs = window.__spDiagLogs || [];
        if (!logs.length) return "No events yet";
        return logs
          .slice(-(max || 10))
          .map(function (x) {
            return x.event + (x.detail ? ": " + x.detail : "");
          })
          .join("\n");
      }

      /** Overlay only — never replace #root (that kills React mid-bundle on slow WebViews). */
      function showWebReloadScreen() {
        if (document.getElementById("sp-native-recovery")) return;
        setBootStatus("Still loading\u2026");
        var layer = document.createElement("div");
        layer.id = "sp-native-recovery";
        layer.style.cssText =
          "position:fixed;inset:0;z-index:100000;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:rgba(13,6,18,0.97);color:#f4efe6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;";
        var logs = window.__spDiagLogs || [];
        var diagText = logs.length
          ? logs
              .slice(-8)
              .map(function (x) {
                return x.event + (x.detail ? ": " + x.detail : "");
              })
              .join("\n")
          : "No diagnostic events captured.";
        layer.innerHTML =
          '<p style="font-size:20px;font-weight:700;margin:0 0 10px;">Having trouble loading</p>' +
          '<p style="font-size:14px;line-height:1.45;opacity:0.9;margin:0 0 12px;max-width:320px;">The app may still be loading. Tap Reload to try again.</p>' +
          '<pre style="font:11px/1.35 ui-monospace,Menlo,monospace;text-align:left;max-width:320px;max-height:28vh;overflow:auto;padding:10px;margin:0 0 16px;background:rgba(0,0,0,0.35);border-radius:8px;white-space:pre-wrap;">' +
          diagText.replace(/</g, "&lt;") +
          "</pre>" +
          '<button type="button" id="sp-native-reload-btn" style="background:#d4a574;color:#1a1208;border:none;border-radius:12px;padding:16px 28px;font-size:16px;font-weight:700;">Reload</button>';
        document.body.appendChild(layer);
        diag("recovery_screen_shown", diagText.slice(0, 200));
        if (debugPanel) {
          try {
            alert("Shepherd's Path load status:\n\n" + diagText);
          } catch (e2) {}
        }
        var reloadBtn = document.getElementById("sp-native-reload-btn");
        if (reloadBtn) reloadBtn.addEventListener("click", function () {
          hardReloadApp();
        });
      }

      function hardReloadApp() {
        var u = "/?native=1&enter=1&_=" + Date.now();
        location.replace(u);
      }

      var enterBtn = document.getElementById("sp-enter-btn");
      if (enterBtn) {
        enterBtn.style.display = "none";
      }
      if (enterBtn) {
        enterBtn.addEventListener("click", function () {
          if (!hasVisibleAppUi()) hardReloadApp();
          else notify();
        });
      }

      function poll() {
        notify();
        if (!sent) setTimeout(poll, 200);
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", poll);
      } else {
        poll();
      }

      window.addEventListener("sp-app-ready", function () {
        notify();
      });

      setTimeout(function () {
        if (hasVisibleAppUi()) return;
        setBootStatus("Still loading\u2026");
      }, 8000);

      setTimeout(function () {
        if (!debugPanel || hasVisibleAppUi()) return;
        try {
          alert("Still loading (6s):\n\n" + latestDiagSummary(10));
        } catch (e) {}
      }, 6000);

      setTimeout(function () {
        if (!debugPanel || hasVisibleAppUi()) return;
        try {
          alert("Still loading (12s):\n\n" + latestDiagSummary(12));
        } catch (e) {}
      }, 12000);

      setTimeout(function () {
        if (hasVisibleAppUi()) return;
        showWebReloadScreen();
      }, 45000);

      function hookModuleScript() {
        function attach(attempts) {
          var mod = document.querySelector('script[type="module"]');
          if (!mod) {
            if (attempts < 80) setTimeout(function () { attach(attempts + 1); }, 50);
            return;
          }
          diag("module_script_seen", mod.getAttribute("src") || "");
          function onModuleReady() {
            diag("module_script_loaded", mod.getAttribute("src") || "");
            setBootStatus("Loading app\u2026");
            setTimeout(function () { poll(); }, 0);
            setTimeout(function () { poll(); }, 120);
            setTimeout(function () { poll(); }, 600);
            setTimeout(function () { poll(); }, 1800);
            setTimeout(function () { poll(); }, 4000);
            setTimeout(function () { poll(); }, 8000);
          }
          mod.addEventListener("load", onModuleReady);
          mod.addEventListener("error", function () {
            diag("module_script_error", mod.getAttribute("src") || "");
            setBootStatus("Could not load app\u2026");
            if (hasVisibleAppUi()) return;
            setTimeout(function () {
              if (!sent && (hasBootPlaceholder() || !hasReactMounted())) {
                showWebReloadScreen();
              }
            }, 400);
          });
          if (document.readyState === "complete") {
            onModuleReady();
          }
        }
        attach(0);
      }
      hookModuleScript();

      // Old TestFlight builds inject #sp-fg-cover on every WebView load — strip it until home paints.
      (function stripReloadCover() {
        var ticks = 0;
        var guard = setInterval(function () {
          ticks += 1;
          spRemoveId("sp-fg-cover");
          if (
            (document.querySelector('[data-testid="landing-home"]') &&
              !document.getElementById("sp-native-boot-placeholder")) ||
            document.querySelector('[data-testid="card-devotional"]')
          ) {
            try {
              if (window.__spSignalReady) window.__spSignalReady();
            } catch (e) {}
            clearInterval(guard);
          }
          if (ticks >= 40) clearInterval(guard);
        }, 500);
      })();

      // Dismiss native overlay once React has mounted real UI (fallback if components miss __spSignalReady).
      setTimeout(function () {
        if (sent) return;
        if (!hasReactMounted() && !hasVisibleAppUi()) return;
        try {
          if (window.__spSignalReady) {
            window.__spSignalReady();
            return;
          }
          notify(true);
        } catch (e) {}
      }, 8000);
      }

      function tryStartNativeBridge() {
        var bridge = window.ReactNativeWebView;
        if (bridge) {
          startNativeBridge(bridge);
          return true;
        }
        diagViaScheme("bridge_wait", "ReactNativeWebView missing");
        return false;
      }

      if (!tryStartNativeBridge()) {
        var bridgeAttempts = 0;
        var bridgeTimer = setInterval(function () {
          bridgeAttempts += 1;
          if (tryStartNativeBridge() || bridgeAttempts >= 120) {
            clearInterval(bridgeTimer);
          }
        }, 50);
        document.addEventListener("DOMContentLoaded", tryStartNativeBridge);
        window.addEventListener("load", tryStartNativeBridge);
      }

      // ── GLOBAL EMERGENCY FALLBACK ──────────────────────────────────────────
      // Two-stage: hide Expo splash fast (1.5 s), then force overlay off (8 s).
      // Fires regardless of startNativeBridge so even a broken bridge unblocks.

      // Stage 1 — hide the Expo native splash (purple cross). Do NOT dismiss the
      // native loading overlay here — wait until real UI paints via notify().
      (function () {
        try {
          var b = window.ReactNativeWebView;
          if (!b) return;
          b.postMessage(JSON.stringify({ type: "react_booted", ts: Date.now() }));
        } catch (e) {}
      })();
      // Belt-and-suspenders: also send at 500 ms in case the bridge initialises
      // slightly after first parse (some WKWebView builds inject it async).
      setTimeout(function () {
        try {
          var b = window.ReactNativeWebView;
          if (!b) return;
          b.postMessage(JSON.stringify({ type: "react_booted", ts: Date.now() }));
        } catch (e) {}
      }, 500);
    })();
    </script>
    <!-- SP_NATIVE_BRIDGE_END -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
    (function () {
      function ensureModuleFromPreload() {
        var scripts = document.getElementsByTagName("script");
        var i;
        for (i = 0; i < scripts.length; i++) {
          if (scripts[i].type === "module") return;
        }
        var src = null;
        var links = document.getElementsByTagName("link");
        for (i = 0; i < links.length; i++) {
          if (links[i].rel === "modulepreload" && (links[i].href || "").indexOf("/assets/index-") !== -1) {
            src = links[i].getAttribute("href");
            break;
          }
        }
        function inject(srcUrl) {
          if (!srcUrl) return;
          var s = document.createElement("script");
          s.type = "module";
          s.src = srcUrl;
          s.addEventListener("error", function () {
            if (window.ReactNativeWebView) return;
            var root = document.getElementById("root");
            if (root && !root.firstElementChild) {
              root.innerHTML =
                '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;color:#ede8e0;font-family:-apple-system,sans-serif;background:#0d0612;">' +
                '<p style="font-size:18px;font-weight:700;margin:0 0 12px;">Could not load Shepherd&rsquo;s Path</p>' +
                '<p style="opacity:0.75;margin:0 0 20px;max-width:280px;line-height:1.5;">Try a hard refresh (Safari: hold Refresh, choose Reload Without Content Blockers).</p>' +
                '<a href="' + location.href + '" style="color:#d4a574;font-weight:600;">Reload page</a></div>';
            }
          });
          document.head.appendChild(s);
          if (window.__spDiag) window.__spDiag("module_injected_page", srcUrl);
        }
        if (src) {
          inject(src);
          return;
        }
        var origin =
          location.protocol === "http:" || location.protocol === "https:"
            ? location.origin
            : "https://www.shepherdspathai.com";
        fetch(origin + "/native-manifest.json", { cache: "no-store" })
          .then(function (r) {
            return r.json();
          })
          .then(function (j) {
            if (j && j.mainJs) inject(j.mainJs);
          })
          .catch(function () {});
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", ensureModuleFromPreload);
      } else {
        ensureModuleFromPreload();
      }
      window.addEventListener("load", ensureModuleFromPreload);
    })();
    </script>
