<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Shepherd's Path</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #1e0d50 0%, #130636 45%, #09031e 100%);
      color: #f4efe6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
      text-align: center;
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .tag { font-size: 15px; color: rgba(244,239,230,0.75); margin-bottom: 28px; line-height: 1.5; max-width: 320px; }
    .btn {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto 12px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary { background: linear-gradient(135deg, #e8c99b, #d4a574); color: #1a1208; }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #f4efe6;
      border: 1px solid rgba(212,165,116,0.35);
    }
  </style>
  <script>
    (function () {
      var inApp = !!window.ReactNativeWebView;
      function signalReady() {
        try {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({ type: "app_ready" }));
          }
        } catch (e) {}
      }
      if (inApp) {
        location.replace("/?native=1&enter=1&_=" + Date.now());
        return;
      }
      signalReady();
      document.addEventListener("DOMContentLoaded", signalReady);
      window.addEventListener("load", signalReady);
    })();
  </script>
</head>
<body>
  <h1>Shepherd&rsquo;s Path</h1>
  <p class="tag">You don&rsquo;t have to walk alone.<br />Daily Scripture, prayer, and guidance.</p>
  <a class="btn btn-primary" href="/?native=1&amp;enter=1">Open the app</a>
  <a class="btn btn-secondary" href="/devotional?native=1&amp;enter=1">Today&rsquo;s devotional</a>
  <a class="btn btn-secondary" href="/guidance?native=1&amp;enter=1">Talk it through</a>
</body>
</html>
