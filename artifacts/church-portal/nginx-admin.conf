# Church admin portal — admin.shepherdspathai.com
# Install: sudo cp artifacts/church-portal/nginx-admin.conf /etc/nginx/sites-available/admin.shepherdspathai.com
#          sudo ln -sf /etc/nginx/sites-available/admin.shepherdspathai.com /etc/nginx/sites-enabled/
# DNS:     A record admin.shepherdspathai.com → 52.42.155.185
# TLS:     sudo certbot --nginx -d admin.shepherdspathai.com
#
# API on port 3001 (api-server PM2). Church portal on port 3003 (church-portal PM2).
# Port 3002 is reserved for turn-service — do not use for church-portal.

server {
    listen 80;
    server_name admin.shepherdspathai.com;

    # certbot will add listen 443 ssl and redirect from :80

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
